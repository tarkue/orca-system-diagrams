<!doctype html><html><head><meta charset="utf-8"><title>Notation contrast regression</title><style>body{background:#181818;color:#eee;font:14px system-ui}section{overflow:auto;border:1px solid #555;margin:20px;max-height:800px}pre{white-space:pre-wrap}</style></head><body><h1>Actual SVG contrast on dark host</h1><pre id="results">Running</pre><main></main><script type="module">
import canonical from '/orca-plugin/model.json';import {sampleProjects} from '/src/core/index.ts';import {renderNotation} from '/src/notations/render.ts';import {notationPaperTheme,applyNotationPaper} from '/src/notations/paper.ts';import mermaid from 'mermaid';
window.contrastQA={done:false,results:[]};
const rgb=s=>s.match(/[\d.]+/g)?.slice(0,3).map(Number);const lum=s=>{const c=rgb(s).map(n=>n/255).map(n=>n<=.04045?n/12.92:((n+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722;};const ratio=(a,b)=>(Math.max(lum(a),lum(b))+.05)/(Math.min(lum(a),lum(b))+.05);
function inspect(svg,name,notation,map={}){
 const paper=svg.querySelector('[data-notation-paper]'),view=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);const cover=!!paper&&['x','y','width','height'].every((k,i)=>Number(paper.getAttribute(k))===view[i])&&getComputedStyle(paper).fill==='rgb(255, 255, 255)'&&getComputedStyle(paper).fillOpacity==='1';
 const text=[];for(const parent of svg.querySelectorAll('text')){const leaves=parent.querySelectorAll('tspan');for(const e of leaves.length?[...leaves].filter(e=>!e.querySelector('tspan')):[parent]){if(!e.textContent.trim())continue;let bg='rgb(255, 255, 255)';if(parent.matches('.actor'))bg=getComputedStyle(svg.querySelector('rect.actor')).fill;if(parent.matches('.labelText'))bg=getComputedStyle(svg.querySelector('.labelBox')).fill;if(parent.matches('.noteText'))bg=getComputedStyle(svg.querySelector('rect.note')).fill;const fill=getComputedStyle(e).fill;const r=ratio(fill,bg);text.push({kind:parent.getAttribute('class')||'state-label',ratio:r,fill,bg,text:e.textContent.slice(0,40)});}}
 const lines=[...svg.querySelectorAll('.actor-line,.messageLine0,.messageLine1,.loopLine,.activation0,.activation1,.activation2')].map(e=>({class:e.getAttribute('class'),stroke:getComputedStyle(e).stroke,ratio:ratio(getComputedStyle(e).stroke,'rgb(255, 255, 255)')}));
 return {name,notation,cover,textCount:text.length,textMin:Math.min(...text.map(x=>x.ratio)),lineMin:lines.length?Math.min(...lines.map(x=>x.ratio)):null,textFailures:text.filter(x=>x.ratio<4.5),lineFailures:lines.filter(x=>x.ratio<3),ids:Object.keys(map).length,passed:cover&&text.length>0&&text.every(x=>x.ratio>=4.5)&&lines.every(x=>x.ratio>=3)};
}
for(const [name,model] of [['canonical',canonical],['sample',sampleProjects[0]],['long-label',(()=>{const m=structuredClone(sampleProjects[0]);m.nodes[0].name='Long participant label — '+m.nodes[0].name.repeat(8);m.workflow.steps[1].name='Long workflow message '+m.workflow.steps[1].name.repeat(8);return m;})()]])for(const notation of ['sequence','state']){try{const r=await renderNotation(model,notation,'contrast-'+name+'-'+notation,{'--background':'#181818','--foreground':'#eeeeee','--card':'#222222'});const section=document.createElement('section');section.innerHTML=r.svg;document.querySelector('main').append(section);window.contrastQA.results.push(inspect(section.querySelector('svg'),name,notation,r.elementIdMap));}catch(e){window.contrastQA.results.push({name,notation,passed:false,error:String(e)});}}
try{mermaid.initialize({startOnLoad:false,securityLevel:'strict',...notationPaperTheme('sequence')});const source='sequenceDiagram\nparticipant A as Client\nparticipant B as Service\nA->>B: Request\nactivate B\nNote right of B: Working\nalt permitted\nB-->>A: Success\nelse denied\nB-->>A: Rejected\nend\ndeactivate B';const r=await mermaid.render('contrast-activation',source);const section=document.createElement('section');section.innerHTML=r.svg;const svg=section.querySelector('svg');applyNotationPaper(svg,'sequence');document.querySelector('main').append(section);window.contrastQA.results.push(inspect(svg,'activation','sequence'));}catch(e){window.contrastQA.results.push({name:'activation',passed:false,error:String(e)});}
window.contrastQA.done=true;document.querySelector('#results').textContent=JSON.stringify(window.contrastQA,null,2);
</script></body></html>
