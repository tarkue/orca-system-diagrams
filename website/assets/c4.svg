яется атомарно.</title><path d="M 775 403 A 140 18 0 0 1 1055 403 V 567 A 140 18 0 0 1 775 567 Z" fill="#255d86" stroke="#8db5d1"></path><ellipse cx="915" cy="403" rx="140" ry="18" fill="#255d86" stroke="#8db5d1"></ellipse><text x="915" y="432" text-anchor="middle" font-size="15" fill="#fff"><tspan x="915" dy="0">Пакет расширения</tspan></text><text x="915" y="486" text-anchor="middle" font-size="12" fill="#e0ebf6"><tspan x="915" dy="0">[Container · Database]</tspan></text><text x="915" y="510" text-anchor="middle" font-size="12" fill="#e0ebf6"><tspan x="915" dy="0">HTML / JSON / filesystem</tspan></text><text x="915" y="547" text-anchor="middle" font-size="12" fill="#fff"><tspan x="915" dy="0">orca-plugin/package содержит</tspan><tspan x="915" dy="17">panel.html, manifest и SHA256SUMS…</tspan></text></g><g id="notation-canonical-c4-node6" data-model-id="host" data-glyph="system"><title>После подключения development path отслеживает пакет, обновляет discovery и documentRevision. Установленная копия сама source не отслеживает.</title><rect x="1140" y="130" width="280" height="200" rx="2" fill="#45464a" stroke="#8db5d1"></rect><rect x="1145" y="135" width="270" height="190" fill="none" stroke="#999"></rect><text x="1280" y="177" text-anchor="middle" font-size="15" fill="#fff"><tspan x="1280" dy="0">Нативный host Orca</tspan></text><text x="1280" y="231" text-anchor="middle" font-size="12" fill="#e0ebf6"><tspan x="1280" dy="0">[Software System · External]</tspan></text><text x="1280" y="255" text-anchor="middle" font-size="12" fill="#e0ebf6"><tspan x="1280" dy="0">Orca 1.4.218 / Electron</tspan></text><text x="1280" y="292" text-anchor="middle" font-size="12" fill="#fff"><tspan x="1280" dy="0">После подключения development path</tspan><tspan x="1280" dy="17">отслеживает пакет, обновляе…</tspan></text></g><g id="notation-canonical-c4-node7" data-model-id="viewer" data-glyph="container"><title>Нативная sandbox-панель показывает нотации, сворачиваемый инспектор и JSON тол