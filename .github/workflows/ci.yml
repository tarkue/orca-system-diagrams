name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:bridge
      - run: npm run check:publication
      - run: npm run package:plugin
      - run: npm run verify:plugin
      - run: npm run build:site
